<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A9D8F">
<meta name="description" content="לוח ניהול לדירות: תפוסה, ניקיון, תקלות, הזמנות, תשלומים ותזרים.">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="דירות של קדושה">
<title>דירות של קדושה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sticky header with tab rail; a grid of brass key-tag cards (one per apartment); details and forms open in a side sheet (bottom sheet on phones) */
:root{
  --bg:#F6F9FB; --surface:#FFFFFF; --surface-2:#F1F6F8; --ink:#1F2B33; --muted:#6B7882; --line:#E3EAEE;
  --accent:#2A9D8F; --accent-ink:#FFFFFF; --accent-soft:#E3F4F1;
  --tag:#F5E3AE; --tag-ink:#5B4611; --tag-edge:#E8CF88;
  --ok:#2C8F55; --ok-soft:#E5F6EB; --warn:#B07710; --warn-soft:#FDF3DC; --bad:#CC4A36; --bad-soft:#FCE9E5;
  --info:#3A78C2; --info-soft:#E8F1FB; --idle:#7A8790; --idle-soft:#EEF2F5;
  --s-in:#2a78d6; --s-out:#eb6834; --grid:#E8EEF1; --axis:#CBD5DB;
  --scrim:rgba(20,32,40,.32); --shadow:0 1px 2px rgba(31,43,51,.04),0 4px 16px rgba(31,43,51,.05);
  --f-display:"Rubik","Assistant",system-ui,sans-serif;
  --f-body:"Assistant","Rubik",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1615; --surface:#15201E; --surface-2:#1A2725; --ink:#E4EDEA; --muted:#98A9A5; --line:#283835;
  --accent:#55B6A6; --accent-ink:#04201B; --accent-soft:#163934;
  --tag:#C8A956; --tag-ink:#211803; --tag-edge:#A88B3D;
  --ok:#5EC489; --ok-soft:#163225; --warn:#E2A640; --warn-soft:#382A10; --bad:#F07B64; --bad-soft:#3C1C16;
  --info:#82A8EA; --info-soft:#19273E; --idle:#95A39F; --idle-soft:#22302D;
  --s-in:#3987e5; --s-out:#d95926; --grid:#24332F; --axis:#34463F;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1615; --surface:#15201E; --surface-2:#1A2725; --ink:#E4EDEA; --muted:#98A9A5; --line:#283835;
  --accent:#55B6A6; --accent-ink:#04201B; --accent-soft:#163934;
  --tag:#C8A956; --tag-ink:#211803; --tag-edge:#A88B3D;
  --ok:#5EC489; --ok-soft:#163225; --warn:#E2A640; --warn-soft:#382A10; --bad:#F07B64; --bad-soft:#3C1C16;
  --info:#82A8EA; --info-soft:#19273E; --idle:#95A39F; --idle-soft:#22302D;
  --s-in:#3987e5; --s-out:#d95926; --grid:#24332F; --axis:#34463F;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.85rem}
.mini-tag{width:26px;height:34px;border-radius:6px 6px 9px 9px;background:var(--tag);border:1px solid var(--tag-edge);position:relative;flex:none}
.mini-tag::before{content:"";position:absolute;top:5px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.top-actions{display:flex;gap:8px;align-items:center}
.chip-role{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab .badge{font-size:.75rem;background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;line-height:1.5}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.small{padding:6px 11px;font-size:.88rem;border-radius:9px}
.btn.danger{background:transparent;border-color:var(--line);color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.84rem;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}
.p-idle{background:var(--idle-soft);color:var(--idle)}
.muted{color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:22px 12px}
.section-head h2{font-size:1.15rem}
.notice{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* stats */
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.stat{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;min-width:0;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.stat b{font-family:var(--f-display);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.stat b{min-width:0;overflow-wrap:anywhere}
.stat.hot b{color:var(--bad)} .stat.money b{color:var(--accent)}

/* unit cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px;margin-top:16px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.unit-open{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:14px;padding:16px;border-radius:var(--r) var(--r) 0 0;flex:1}
.unit-open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tag{width:56px;height:74px;border-radius:9px 9px 15px 15px;background:var(--tag);border:1px solid var(--tag-edge);color:var(--tag-ink);position:relative;display:grid;place-items:end center;padding-bottom:8px;font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1}
.tag::before{content:"";position:absolute;top:9px;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--surface);box-shadow:inset 0 1px 3px rgba(0,0,0,.28)}
.tag.sm{width:34px;height:44px;font-size:1.1rem;border-radius:6px 6px 10px 10px;padding-bottom:5px}
.tag.sm::before{top:6px;width:7px;height:7px;margin-left:-3.5px}
.ubody{display:flex;flex-direction:column;gap:7px;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.uline{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.93rem;min-width:0}
.uline span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uline.alert{color:var(--bad);font-weight:700}
.uline.good{color:var(--ok);font-weight:700}
.uline.money{color:var(--accent);font-weight:700}
.quick{display:flex;border-top:1px solid var(--line)}
.quick button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:none;border:0;padding:10px 8px;cursor:pointer;font-weight:600;color:var(--accent);font-size:.9rem}
.quick button+button{border-inline-start:1px solid var(--line)}
.quick button:disabled{opacity:.4;cursor:not-allowed}

/* rows / lists */
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:auto 1fr;gap:14px;min-width:0}
.row-main{min-width:0;display:flex;flex-direction:column;gap:6px}
.row-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.row-meta{color:var(--muted);font-size:.88rem}
.row-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cat-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem}
.desc{white-space:pre-wrap;overflow-wrap:anywhere}
.seg3{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.seg3 .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.fsel{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px}

/* money */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:4px}
.fig{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.fig small{display:block;color:var(--muted);font-size:.78rem;letter-spacing:.02em}
.fig b{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums}
.fig.bad b{color:var(--bad)} .fig.ok b{color:var(--ok)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
details.pays summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem}
.pay{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}

/* log & settings */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.logrow{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.logrow:last-child{border-bottom:0}
.member{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.member img{width:30px;height:30px;border-radius:50%}
.member .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.help{font-size:.92rem;color:var(--muted)}
.help ol{padding-inline-start:20px;margin:6px 0}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;z-index:21;top:0;bottom:0;inset-inline-end:0;width:min(540px,100%);background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.25)}
.sheet-head{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-head h2{flex:1;font-size:1.2rem}
.sheet-body{overflow-y:auto;padding:16px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){
  .sheet{top:auto;max-height:92%;width:100%;border-radius:18px 18px 0 0;overflow:hidden}
  .sheet-head{padding-top:14px}
}
.block h3{font-size:1rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}

/* forms */
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.lbl{font-weight:700;font-size:.92rem}
.field .hint{font-size:.82rem;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
textarea{min-height:84px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.frow{grid-template-columns:1fr}}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600}
.opts input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opts input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.catgrid span{width:100%}
.form-actions{display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.err{color:var(--bad);font-weight:700;font-size:.9rem;min-height:1em}

/* lock screen + users */
.lock{display:grid;place-items:center;min-height:100%;padding-block:40px}
.lock-card{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px 20px;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:stretch}
.lock-card h2{font-size:1.35rem}
.lock-card p{margin:0}
.lock-brand{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-size:1.05rem}
.lock-card form{text-align:start}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;font:inherit}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.person{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);min-width:0}
.person b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person:hover{border-color:var(--accent);background:var(--accent-soft)}
.person:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.2rem;flex:none}
.av.big{width:64px;height:64px;font-size:1.7rem;align-self:center}
.av.sm{width:28px;height:28px;font-size:.85rem}
.av.manager{background:var(--accent-soft);color:var(--accent)} .av.cleaning{background:var(--info-soft);color:var(--info)} .av.maintenance{background:var(--warn-soft);color:var(--warn)}
.pin-input{font-size:1.5rem;letter-spacing:.4em;text-align:center;font-family:var(--f-display);direction:ltr}
.user-chip{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.urow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.urow:last-child{border-bottom:0}
.urow .nm{flex:1;min-width:8ch;font-weight:700}

/* role switcher + board view toggle */
.mode{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;color:var(--muted)}
.mode select{width:auto;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:700}
.board-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}
.board-bar .stats{margin-top:0}
.vtoggle{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.vtoggle button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9px;font-weight:700;color:var(--muted)}
.vtoggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.vtoggle button:focus-visible{outline:2px solid var(--accent)}

/* calendar */
.cal-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-block:16px 10px}
.cal-bar .range{font-family:var(--f-display);font-weight:600;font-size:1.05rem;min-width:12ch;text-align:center}
.cal-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.84rem;color:var(--muted);margin-bottom:8px}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:18px;height:10px;border-radius:4px}
.sw.short{background:var(--info-soft);border:1px solid var(--info)} .sw.long{background:var(--accent-soft);border:1px solid var(--accent)}
.sw.blk{background:repeating-linear-gradient(45deg,var(--idle-soft) 0 4px,var(--surface) 4px 8px);border:1px solid var(--line)}
.cal-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cal{--namew:84px;--dw:42px;min-width:max-content}
.cal-row{display:grid;grid-template-columns:var(--namew) repeat(var(--n),var(--dw));grid-template-rows:48px;border-bottom:1px solid var(--line)}
.cal-row:last-child{border-bottom:0}
.cal-row>*{grid-row:1;min-width:0}
.cal-row.mrow{grid-template-rows:28px;background:var(--surface-2)}
.cal-row.drow{grid-template-rows:42px}
.cal-name{position:sticky;inset-inline-start:0;z-index:3;background:var(--surface);border-inline-end:1px solid var(--line);display:flex;align-items:center;gap:7px;padding-inline:8px;font-weight:700}
.mrow .cal-name{background:var(--surface-2)}
button.cal-name{border:0;border-inline-end:1px solid var(--line);cursor:pointer;text-align:start;font:inherit;color:inherit}
.cdot{width:9px;height:9px;border-radius:50%;flex:none}
.cdot.clean{background:var(--ok)} .cdot.dirty{background:var(--warn)} .cdot.progress{background:var(--info)} .cdot.unknown{background:var(--line)}
.mh{font-size:.8rem;font-weight:700;padding-inline:8px;display:flex;align-items:center;border-inline-start:1px solid var(--line);white-space:nowrap;overflow:hidden}
.dh{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);border-inline-start:1px solid var(--grid);line-height:1.15}
.dh b{font-size:.88rem;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 5px;border-radius:99px}
.dh.today b{background:var(--accent);color:var(--accent-ink)}
.dh.sat,.cell.sat{background:var(--surface-2)}

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
function todayIso(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseIso(iso){const [y,m,d]=String(iso).split("-").map(Number);return {y,m,d};}
function utc(iso){const p=parseIso(iso);return Date.UTC(p.y,p.m-1,p.d);}
function diffDays(a,b){return Math.round((utc(b)-utc(a))/864e5);}
function addMonths(iso,k){const p=parseIso(iso);const tm=(p.m-1)+k;const ny=p.y+Math.floor(tm/12),nm=((tm%12)+12)%12;const dim=new Date(Date.UTC(ny,nm+1,0)).getUTCDate();return ny+"-"+pad(nm+1)+"-"+pad(Math.min(p.d,dim));}
function countPeriods(start,pred){let k=0;while(k<600&&pred(addMonths(start,k)))k++;return k;}
const loc=()=>S.lang==="he"?"he-IL":"en-GB";
function fmtD(iso){
  if(!iso)return "";const dd=diffDays(todayIso(),iso);
  if(dd===0)return t("today");if(dd===1)return t("tomorrow");if(dd===-1)return t("yesterday");
  const p=parseIso(iso);const o={day:"numeric",month:"short"};if(p.y!==new Date().getFullYear())o.year="numeric";
  return new Intl.DateTimeFormat(loc(),o).format(new Date(p.y,p.m-1,p.d));
}
function tsIso(ts){const d=new Date(ts);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function fmtTs(ts){if(!ts)return "";const d=new Date(ts);return fmtD(tsIso(ts))+" "+pad(d.getHours())+":"+pad(d.getMinutes());}
function money(n){

  return new Intl.NumberFormat(S.lang==="he"?"he-IL":"en-US",{minimumFractionDigits:fd,maximumFractionDigits:2}).format(n);
}

function occOf(u){
  const d=uDoc(u),today=todayIso();
  const sch=(d.schedule||[]).slice().sort((a,b)=>a.s<b.s?-1:a.s>b.s?1:0);
  const cur=sch.find(x=>x.s<=today&&(!x.e||today<x.e));
  const outToday=sch.find(x=>x.e===today);
  const inToday=sch.find(x=>x.s===today);
  const next=sch.find(x=>x.s>today);
  return {state:d.blocked?"blocked":(cur?"occupied":"vacant"),cur,next,outToday,inToday};
}

/* money math */
function fig(st){
  const today=todayIso(),rate=+st.rate||0,paid=(st.pay||[]).reduce((a,p)=>a+(+p.amt||0),0);
  let total=null,due=0,count=null;
  if(st.per==="night"){
    if(st.end){count=Math.max(0,diffDays(st.start,st.end));total=count*rate;due=total;}
    else{count=Math.max(0,diffDays(st.start,today));due=count*rate;}
  }else if(st.per==="month"){
    if(st.end){count=countPeriods(st.start,p=>p<st.end);total=count*rate;}
    due=countPeriods(st.start,p=>p<=today&&(!st.end||p<st.end))*rate;
  }else{total=rate;due=rate;}
  return {paid,total,due,count,owed:Math.max(0,due-paid),credit:Math.max(0,paid-due),left:total==null?null:Math.max(0,total-paid)};
}
function stayState(st){const today=todayIso();if(st.start>today)return "upcoming";if(st.end&&st.end<=today)return "ended";return "current";}

function draw(){
  const app=document.getElementById("app");
  if(S.settings.name&&document.title!==appName())document.title=appName();
  if(S.status==="noconfig"){app.innerHTML=lockFrame(`<h2>${t("noConfig")}</h2>`);return;}
  if(S.status==="ok"){
    let gate=null;const loading=`<div class="wrap lock"><div class="lock-card"><p class="muted">${t("loading")}</p></div></div>`;
    if(!S.authReady)gate=loading;
    else if(!S.authUser)gate=(S.setupOpen&&S.showSetup)?setupScreen():(!S.setupOpen&&S.showSignup)?signupScreen():loginScreen();
    else if(!S.profileLoaded||S.settingUp)gate=loading;
    else if(S.profile&&!S.profile.disabled&&S.profile.role==="pending")gate=pendingScreen();
    else if(!S.profile||S.profile.disabled||!ROLES.includes(S.profile.role))gate=inactiveScreen();
    if(gate){if(S.sheet)closeSheet();const keep=gateKeep();app.innerHTML=gate;gateRestore(keep);return;}
  }
  const allowed=TABS[role()];
  const tabNow=allowed.includes(S.tab)?S.tab:allowed[0];
  if(tabNow!==S.tab&&S.status==="ok"&&S.profileLoaded)S.tab=tabNow;
  const nIss=S.issues.filter(i=>i.status!=="done").length;
  const tabs=allowed.map(k=>[k,TAB_IC[k]]);

  if(S.status==="loading")notice=`<div class="notice">${t("loading")}</div>`;
  else if(S.status==="nodb")notice=`<div class="notice">${t("nodb")}</div>`;
  else if(S.status==="revoked")notice=`<div class="notice">${t("revoked")}</div>`;
  else if(!S.canWrite)notice=`<div class="notice">${t("readonly")}</div>`;
  else if(isMgr()&&pendingUsers().length)notice=`<div class="notice" style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span>${t("reqNotice",pendingUsers().length)}</span><button type="button" class="btn small" data-act="goRequests">${t("review")}</button></div>`;
  const view={board:viewBoard,clean:viewClean,issues:viewIssues,money:viewMoney,cash:viewCash,more:viewMore}[tabNow]||viewBoard;

  <header class="top"><div class="wrap" style="padding-block:0">
    <div class="top-row">
      <div class="brand"><div class="mini-tag" aria-hidden="true"></div><div><h1>${esc(appName())}</h1><small>${t("sub")}</small></div></div>

        ${roleUi}
        <button type="button" class="btn ghost small" data-act="lang" aria-label="${t("langBtn")}">${svg("globe")}<span class="hide-sm">${t("langBtn")}</span><span class="show-sm">${t("langShort")}</span></button>

  </div></header>

function viewBoard(){

  const nIss=S.issues.filter(i=>i.status!=="done").length;
  const owed=isMgr()?S.stays.reduce((a,s)=>a+fig(s).owed,0):0;
  return `<div class="board-bar"><div class="stats">

function isoAdd(iso,k){const p=parseIso(iso);const d=new Date(Date.UTC(p.y,p.m-1,p.d+k));return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());}
function calStays(u){
  if(isMgr()&&S.stays.length)return S.stays.filter(s=>s.u===u&&s.start).map(s=>({s:s.start,e:s.end||null,g:s.guest||"",id:s.id,kind:s.kind}));
  return (uDoc(u).schedule||[]).map(x=>({s:x.s,e:x.e||null,g:x.g||""}));
}
function viewCal(){
  const today=todayIso(),start=S.calStart||isoAdd(today,-2),end=isoAdd(start,CAL_DAYS);
  const days=[];for(let i=0;i<CAL_DAYS;i++)days.push(isoAdd(start,i));
  const dow=iso=>new Date(utc(iso)).getUTCDay();
  const wd=new Intl.DateTimeFormat(loc(),{weekday:"narrow",timeZone:"UTC"});
  const rf=new Intl.DateTimeFormat(loc(),{day:"numeric",month:"short"});
  const months=[];days.forEach((d,i)=>{const k=d.slice(0,7);if(!months.length||months[months.length-1].k!==k)months.push({k,from:i,n:1});else months[months.length-1].n++;});
  const mgr=isMgr();
  const rows=unitIds().map(u=>{
    const d=uDoc(u),stays=calStays(u);
    const turns=new Set(stays.map(s=>s.e).filter(Boolean));
    const cells=days.map((day,i)=>`<button type="button" class="cell${day===today?" today":""}${dow(day)===6?" sat":""}" style="grid-column:${i+2}" data-act="calCell" data-u="${esc(u)}" data-d="${day}" aria-label="${esc(t("apt",u))} ${fmtD(day)}">${turns.has(day)?svg("broom"):""}</button>`).join("");
    const bars=stays.filter(s=>s.s<end&&(!s.e||s.e>start)).map(s=>{
      const cs=Math.max(0,diffDays(start,s.s)),ce=s.e?Math.min(CAL_DAYS,diffDays(start,s.e)):CAL_DAYS;if(ce<=cs)return "";
      const cls=`bar2${s.kind==="long"?" long":""}${s.s<start?" cs":""}${!s.e||s.e>end?" ce":""}`;
      const label=`${s.g||t("guest")} · ${fmtD(s.s)} – ${s.e?fmtD(s.e):t("openEnded")}`;
      return `<button type="button" class="${cls}" style="grid-column:${cs+2} / ${ce+2}" data-act="calBar" data-u="${esc(u)}" data-id="${esc(s.id||"")}" title="${esc(label)}" aria-label="${esc(t("apt",u)+": "+label)}">${svg("user")}<span>${esc(s.g||t("guest"))}</span></button>`;
    }).join("");
    return `<div class="cal-row${d.blocked?" blocked":""}"><button type="button" class="cal-name" style="grid-column:1" data-act="openUnit" data-u="${esc(u)}" title="${esc(t("clean_"+(d.clean||"unknown")))}"><span class="cdot ${esc(d.clean||"unknown")}" aria-hidden="true"></span>${esc(u)}</button>${cells}${bars}</div>`;
  }).join("");
  return `<div class="cal-bar">
      <button type="button" class="icon-btn" data-act="calStep" data-v="-14" aria-label="${t("calPrev")}">${svg(S.lang==="he"?"prev":"next")}</button>
      <span class="range">${rf.format(new Date(utc(start)))} – ${rf.format(new Date(utc(isoAdd(end,-1))))}</span>
      <button type="button" class="icon-btn" data-act="calStep" data-v="14" aria-label="${t("calNext")}">${svg(S.lang==="he"?"next":"prev")}</button>
      ${S.calStart?`<button type="button" class="btn ghost small" data-act="calToday">${t("calToday")}</button>`:""}
    </div>
    <div class="cal-legend"><span><i class="sw short"></i>${t("kind_short")}</span><span><i class="sw long"></i>${t("kind_long")}</span><span>${svg("broom")}${t("calTurn")}</span><span><i class="sw blk"></i>${t("occ_blocked")}</span><span>${mgr?t("calHintMgr"):t("calHint")}</span></div>
    <div class="cal-scroll"><div class="cal" style="--n:${CAL_DAYS}">
      <div class="cal-row mrow"><div class="cal-name" style="grid-column:1"></div>${months.map(m=>`<div class="mh" style="grid-column:${m.from+2} / span ${m.n}">${esc(mLabel(m.k))}</div>`).join("")}</div>
      <div class="cal-row drow"><div class="cal-name" style="grid-column:1"></div>${days.map((d,i)=>`<div class="dh${d===today?" today":""}${dow(d)===6?" sat":""}" style="grid-column:${i+2}"><small>${esc(wd.format(new Date(utc(d))))}</small><b>${+d.slice(8)}</b></div>`).join("")}</div>
      ${rows}
    </div></div>`;
}

function card(u){
  const d=uDoc(u),o=occOf(u),iss=openIssues(u),urgent=iss.some(i=>i.prio==="urgent");
  const lines=[];
  if(o.outToday)lines.push(`<div class="uline alert">${svg("out")}<span>${t("checkoutToday")}</span></div>`);
  if(o.inToday)lines.push(`<div class="uline alert">${svg("in")}<span>${t("checkinToday")} · ${esc(o.inToday.g||t("guest"))}</span></div>`);
  if(o.cur&&!o.inToday)lines.push(`<div class="uline">${svg("user")}<span>${esc(o.cur.g||t("guest"))} · ${o.cur.e?t("until",fmtD(o.cur.e)):t("openEnded")}</span></div>`);
  if(o.next)lines.push(`<div class="uline">${svg("cal")}<span>${t("nextArrival",fmtD(o.next.s))}</span></div>`);
  else if(!o.cur)lines.push(`<div class="uline">${svg("cal")}<span>${t("noUpcoming")}</span></div>`);
  if(d.blocked&&d.blockNote)lines.push(`<div class="uline">${svg("alert")}<span>${esc(d.blockNote)}</span></div>`);
  lines.push(iss.length?`<div class="uline${urgent?" alert":""}">${svg("other")}<span>${t("issuesN",iss.length)}</span></div>`:`<div class="uline">${svg("check")}<span>${t("noOpenIssues")}</span></div>`);
  if(isMgr()){const ow=unitOwed(u);if(ow>0)lines.push(`<div class="uline money">${svg("cash")}<span class="num">${t("toCollect",money(ow))}</span></div>`);}
  const ready=o.state==="vacant"&&d.clean==="clean"&&!urgent;
  if(ready)lines.unshift(`<div class="uline good">${svg("check")}<span>${t("ready")}</span></div>`);
  const isClean=d.clean==="clean";
  return `<article class="unit">
    <button type="button" class="unit-open" data-act="openUnit" data-u="${esc(u)}" aria-label="${esc(t("apt",u))}">
      <div class="tag" aria-hidden="true">${esc(u)}</div>
      <div class="ubody"><div class="pills">${occPill(o.state)}${cleanPill(d.clean)}</div>${lines.join("")}</div>
    </button>
    <div class="quick">
      ${perm("clean")?`<button type="button" data-act="clean" data-u="${esc(u)}" data-v="${isClean?"dirty":"clean"}"${dis()}>${svg(isClean?"broom":"check")}${t(isClean?"q_markDirty":"q_markClean")}</button>`:""}
      ${perm("report")?`<button type="button" data-act="newIssue" data-u="${esc(u)}"${dis()}>${svg("plus")}${t("q_report")}</button>`:""}
    </div>
  </article>`;
}

function cleanControls(u){
  if(!perm("clean"))return "";
  const c=uDoc(u).clean;
  return `<div class="seg3">${["clean","progress","dirty"].map(v=>`<button type="button" class="btn ghost small" aria-pressed="${c===v}" data-act="clean" data-u="${esc(u)}" data-v="${v}"${dis()}>${t("clean_"+v)}</button>`).join("")}</div>`;
}

function viewClean(){
  const today=todayIso();
  const rows=unitIds().map(u=>{const d=uDoc(u),o=occOf(u);const need=d.clean!=="clean";const arr=o.inToday?today:(o.next?o.next.s:"9999");return {u,d,o,need,arr};})
    .sort((a,b)=>(b.need-a.need)||(a.arr<b.arr?-1:a.arr>b.arr?1:0)||(a.u<b.u?-1:1));
  return `<div class="section-head"><h2>${t("cleanTitle")}</h2><span class="muted">${t("cleanHelp")}</span></div>
  <div class="list">${rows.map(({u,d,o})=>{
    const meta=[];
    if(o.outToday)meta.push(`<span class="uline alert">${svg("out")}${t("checkoutToday")}</span>`);
    if(o.inToday)meta.push(`<span class="uline alert">${svg("in")}${t("checkinToday")}</span>`);
    else if(o.next)meta.push(`<span class="uline${diffDays(today,o.next.s)<=1&&d.clean!=="clean"?" alert":""}">${svg("cal")}${t("arrival",fmtD(o.next.s))}</span>`);
    const last=d.cleanAt?(d.clean==="clean"?t("lastCleaned",fmtTs(d.cleanAt),esc(nm(d.cleanBy))):t("markedBy",fmtTs(d.cleanAt),esc(nm(d.cleanBy)))):t("neverCleaned");
    return `<div class="row"><button type="button" class="tag sm" style="cursor:pointer" data-act="openUnit" data-u="${esc(u)}" aria-label="${esc(t("apt",u))}">${esc(u)}</button>
      <div class="row-main"><div class="row-title">${esc(t("apt",u))} ${cleanPill(d.clean)} ${occPill(o.state)}</div>
      <div class="row-meta">${last}</div>${meta.join("")}${cleanControls(u)}
      ${perm("report")?`<div><button type="button" class="btn ghost small" data-act="newIssue" data-u="${esc(u)}"${dis()}>${svg("plus")}${t("q_report")}</button></div>`:""}</div></div>`;
  }).join("")}</div>`;
}

function issueRow(i,showUnit){
  const c=CATS.includes(i.cat)?i.cat:"other";
  const tone=i.status==="done"?"p-ok":i.prio==="urgent"?"p-bad":"p-warn";
  const acts=[];
  if(perm("issueStatus")){
  if(i.status==="open")acts.push(`<button type="button" class="btn soft small" data-act="issueSt" data-id="${esc(i.id)}" data-v="progress"${dis()}>${t("doProgress")}</button>`);
  if(i.status!=="done")acts.push(`<button type="button" class="btn small" data-act="issueSt" data-id="${esc(i.id)}" data-v="done"${dis()}>${svg("check")}${t("doDone")}</button>`);
  else acts.push(`<button type="button" class="btn ghost small" data-act="issueSt" data-id="${esc(i.id)}" data-v="open"${dis()}>${t("doReopen")}</button>`);
  }
  if(isMgr())acts.push(`<button type="button" class="btn danger small" data-act="delIssue" data-id="${esc(i.id)}"${dis()}>${t("del")}</button>`);
  return `<div class="row"><div class="cat-ic ${tone}">${svg(c)}</div><div class="row-main">
    <div class="row-title">${showUnit?`<span class="tag sm" aria-hidden="true">${esc(i.u)}</span>`:""}${t("cat_"+c)} ${statusPill(i.status||"open")} ${i.status!=="done"?prioPill(i.prio||"normal"):""}</div>
    ${i.desc?`<div class="desc">${esc(i.desc)}</div>`:""}
    <div class="row-meta">${t("reportedBy",esc(nm(i.by)),fmtTs(i.at))}${i.who?` · ${t("assignee",esc(i.who))}`:""}${i.status==="done"&&i.doneAt?` · ${t("fixedBy",esc(nm(i.doneBy)),fmtTs(i.doneAt))}`:""}</div>
    <div class="row-actions">${acts.join("")}</div></div></div>`;
}
const prioRank={urgent:0,normal:1,low:2};
function sortIssues(a){return a.slice().sort((x,y)=>((x.status==="done")-(y.status==="done"))||((prioRank[x.prio]??1)-(prioRank[y.prio]??1))||((y.at||0)-(x.at||0)));}

function viewIssues(){
  let list=S.issues;
  if(S.issueFilter==="open")list=list.filter(i=>i.status!=="done");else if(S.issueFilter==="done")list=list.filter(i=>i.status==="done");
  if(S.issueUnit)list=list.filter(i=>i.u===S.issueUnit);
  list=sortIssues(list);
  return `<div class="section-head"><h2>${t("issuesTitle")}</h2>${perm("report")?`<button type="button" class="btn" data-act="newIssue"${dis()}>${svg("plus")}${t("newIssue")}</button>`:""}</div>
  <div class="filters">${["open","done","all"].map(f=>`<button type="button" class="fchip" aria-pressed="${S.issueFilter===f}" data-act="issueFilter" data-v="${f}">${t("f_"+f)}</button>`).join("")}
    <select class="fsel" id="issue-unit-filter" data-chg="issueUnit" aria-label="${t("f_unit")}"><option value="">${t("allUnits")}</option>${unitIds().map(u=>`<option value="${esc(u)}"${S.issueUnit===u?" selected":""}>${esc(t("apt",u))}</option>`).join("")}</select></div>
  <div class="list" style="margin-top:12px">${list.length?list.map(i=>issueRow(i,true)).join(""):`<div class="empty">${t("noIssuesHere")}</div>`}</div>`;
}

function stayCard(s,showUnit){
  const f=fig(s),st=stayState(s);
  const stTone=st==="current"?"p-info":st==="upcoming"?"p-idle":"p-ok";
  const rateTxt=`${money(s.rate)} ${t("per_"+(s.per||"total"))}`;
  const dates=`${fmtD(s.start)} – ${s.end?fmtD(s.end):t("openEnded")}`;
  const countTxt=f.count!=null?(s.per==="night"?t("nights",f.count):s.per==="month"?t("months",f.count):""):"";
  const figs=[`<div class="fig ok"><small>${t("paid")}</small><b>${money(f.paid)}</b></div>`];
  if(s.per==="month"){
    figs.push(`<div class="fig"><small>${t("dueNow")}</small><b>${money(f.due)}</b></div>`);
    figs.push(f.credit>0?`<div class="fig ok"><small>${t("credit")}</small><b>${money(f.credit)}</b></div>`:`<div class="fig${f.owed>0?" bad":""}"><small>${t("owedNow")}</small><b>${money(f.owed)}</b></div>`);
    if(f.total!=null)figs.push(`<div class="fig"><small>${t("contractLeft")}</small><b>${money(f.left)}</b></div>`);
  }else{
    if(f.total!=null)figs.push(`<div class="fig"><small>${t("total")}</small><b>${money(f.total)}</b></div>`);
    figs.push(`<div class="fig${f.owed>0?" bad":""}"><small>${t("left")}</small><b>${money(f.owed)}</b></div>`);
  }
  const base=s.per==="month"?(f.total||f.due):f.total||f.due;const pct=base>0?Math.min(100,Math.round(f.paid/base*100)):(f.paid>0?100:0);
  const pays=(s.pay||[]).map((p,i)=>({...p,i})).sort((a,b)=>(b.d||"")<(a.d||"")?-1:1);
  return `<div class="row">${showUnit?`<span class="tag sm" aria-hidden="true">${esc(s.u)}</span>`:`<div class="cat-ic p-info">${svg("user")}</div>`}<div class="row-main">
    <div class="row-title">${esc(s.guest||t("guest"))} <span class="pill ${stTone}">${t("st_"+st)}</span> <span class="pill p-idle">${t("kind_"+(s.kind||"short"))}</span></div>
    <div class="row-meta num">${dates}${countTxt?` · ${countTxt}`:""} · ${rateTxt}${s.contact?` · ${esc(s.contact)}`:""}</div>
    ${s.notes?`<div class="desc row-meta">${esc(s.notes)}</div>`:""}
    <div class="figs num">${figs.join("")}</div>
    <div class="bar" role="img" aria-label="${pct}%"><i style="width:${pct}%"></i></div>
    <details class="pays"><summary>${t("payments",pays.length)}</summary>
      ${pays.length?pays.map(p=>`<div class="pay num"><span>${fmtD(p.d)} · <b>${money(p.amt)}</b>${p.m?` · ${t("m_"+p.m)}`:""}${p.note?` · ${esc(p.note)}`:""}</span><button type="button" class="btn danger small" data-act="delPay" data-id="${esc(s.id)}" data-i="${p.i}"${dis()}>${t("del")}</button></div>`).join(""):`<div class="row-meta">${t("noPays")}</div>`}
    </details>
    <div class="row-actions">
      <button type="button" class="btn small" data-act="addPay" data-id="${esc(s.id)}"${dis()}>${svg("cash")}${t("addPay")}</button>
      <button type="button" class="btn ghost small" data-act="editStay" data-id="${esc(s.id)}"${dis()}>${t("edit")}</button>
      <button type="button" class="btn danger small" data-act="delStay" data-id="${esc(s.id)}"${dis()}>${t("del")}</button>
    </div></div></div>`;
}

function viewMoney(){
  const month=todayIso().slice(0,7);
  const owed=S.stays.reduce((a,s)=>a+fig(s).owed,0);
  const coll=S.stays.reduce((a,s)=>a+(s.pay||[]).filter(p=>(p.d||"").slice(0,7)===month).reduce((x,p)=>x+(+p.amt||0),0),0);
  const contract=S.stays.reduce((a,s)=>{const f=fig(s);return a+(f.left||0);},0);
  let list=S.stays.slice();
  if(S.stayFilter==="active")list=list.filter(s=>stayState(s)!=="ended"||fig(s).owed>0);
  list.sort((a,b)=>{const r={current:0,upcoming:1,ended:2};return (r[stayState(a)]-r[stayState(b)])||(a.start<b.start?-1:1);});
  return `${S.settings.currency?"":`<div class="notice">${t("setCurrencyFirst")}</div>`}
  <div class="stats">
    <div class="stat${owed>0?" hot":""}"><b>${money(owed)}</b><span>${t("owedTotal")}</span></div>
    <div class="stat money"><b>${money(coll)}</b><span>${t("collectedMonth")}</span></div>
    <div class="stat"><b>${money(contract)}</b><span>${t("contractTotal")}</span></div>
  </div>
  <div class="section-head"><h2>${t("moneyTitle")}</h2><button type="button" class="btn" data-act="newStay"${dis()}>${svg("plus")}${t("newStay")}</button></div>
  <div class="filters">${["active","all"].map(f=>`<button type="button" class="fchip" aria-pressed="${S.stayFilter===f}" data-act="stayFilter" data-v="${f}">${t("f_"+f)}</button>`).join("")}</div>
  <div class="list" style="margin-top:12px">${list.length?list.map(s=>stayCard(s,true)).join(""):`<div class="empty">${t("noStays")}</div>`}</div>`;
}

function logText(l){
  const u=l.u?t("apt",l.u):"";const p=l.p||{};
  switch(l.t){
    case "clean":return t("lg_clean",u,t("clean_"+p.v));
    case "issue_new":return t("lg_issue_new",u,t("cat_"+(p.c||"other")));
    case "issue_st":return t("lg_issue_st",u,t("cat_"+(p.c||"other")),t("is_"+p.s));
    case "issue_del":return t("lg_issue_del",u,t("cat_"+(p.c||"other")));
    case "stay_new":return t("lg_stay_new",u);case "stay_edit":return t("lg_stay_edit",u);case "stay_del":return t("lg_stay_del",u);
    case "pay":return t("lg_pay",u);case "pay_del":return t("lg_pay_del",u);
    case "unit":return t("lg_unit",u);case "role":return t("lg_role");case "cur":return t("lg_cur");
    case "entry_new":return (u?u+": ":"")+t("lg_entry_new",p.k);case "entry_edit":return (u?u+": ":"")+t("lg_entry_edit");
    case "entry_del":return (u?u+": ":"")+t("lg_entry_del");case "rec":return t("lg_rec");case "user":return t("lg_user");case "import":return t("lg_import");
    default:return "";
  }
}
const FIN_LOG=["user","stay_new","stay_edit","stay_del","pay","pay_del","cur","entry_new","entry_edit","entry_del","rec"];
function logRows(list){
  list=list.filter(l=>isMgr()||!FIN_LOG.includes(l.t));
  if(!list.length)return `<div class="row-meta">${t("noLog")}</div>`;
  return list.map(l=>`<div class="logrow"><span class="muted num">${fmtTs(l.at)}</span><span><b>${esc(nm(l.by))}</b> · ${esc(logText(l))}</span></div>`).join("");
}

/* ---------- cash flow ---------- */
const curMonth=()=>todayIso().slice(0,7);
const validMonth=m=>/^\d{4}-(0[1-9]|1[0-2])$/.test(String(m||""));
function mAdd(m,k){const [y,mm]=m.split("-").map(Number);const n=y*12+(mm-1)+k;return Math.floor(n/12)+"-"+pad(n%12+1);}
function mLabel(m,short){const [y,mm]=m.split("-").map(Number);return new Intl.DateTimeFormat(loc(),short?{month:"short"}:{month:"long",year:"numeric"}).format(new Date(y,mm-1,1));}
function monthData(m){
  const inc=[],out=[];
  S.stays.forEach(s=>(s.pay||[]).forEach(p=>{if(String(p.d||"").slice(0,7)===m)inc.push({src:"pay",d:p.d,amt:+p.amt||0,u:s.u||"",cat:"stay",note:s.guest||""});}));
  S.entries.forEach(e=>{if(String(e.d||"").slice(0,7)===m)(e.kind==="in"?inc:out).push({src:"entry",id:e.id,d:e.d,amt:+e.amt||0,u:e.u||"",cat:e.cat||(e.kind==="in"?"other_in":"other"),note:e.note||""});});
  S.recurring.forEach(r=>{if(validMonth(r.from)&&r.from<=m&&(!r.to||m<=r.to))out.push({src:"rec",id:r.id,d:m+"-"+pad(Math.min(Math.max(+r.day||1,1),28)),amt:+r.amt||0,u:r.u||"",cat:r.cat||"other",note:r.note||""});});
  const tin=inc.reduce((a,x)=>a+x.amt,0),tout=out.reduce((a,x)=>a+x.amt,0);
  return {inc,out,tin,tout,net:tin-tout};
}
function niceMax(v){if(!(v>0))return 0;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of [1,2,2.5,5,10])if(k*p>=v)return k*p;return 10*p;}
function deltaHtml(cur,prev,upGood){
  if(prev==null)return `<span class="delta flat">${t("cf_noPrev")}</span>`;
  const d=cur-prev;if(Math.abs(d)<0.005)return `<span class="delta flat">= ${t("cf_vsPrev",money(0))}</span>`;
  return `<span class="delta ${(d>0)===upGood?"up-good":"up-bad"}">${d>0?"▲":"▼"} ${t("cf_vsPrev",money(Math.abs(d)))}</span>`;
}
const OUT_IC={rent:"home",cleaning:"broom",utilities:"electric",internet:"internet",repairs:"other",supplies:"appliance",fees:"cash",taxes:"list",other:"list"};
const cfLabel=x=>x.dir==="in"?(x.cat==="stay"?t("ic_stay"):t("ic_"+x.cat)):t("oc_"+x.cat);

function cfChart(m){
  const data=[];for(let k=11;k>=0;k--){const mm=mAdd(m,-k);const d=monthData(mm);data.push({m:mm,tin:d.tin,tout:d.tout});}
  const max=niceMax(Math.max(0,...data.map(d=>Math.max(d.tin,d.tout))));
  if(!max)return `<div class="empty">${t("cf_noChart")}</div>`;
  const ticks=[0,1,2,3,4].map(i=>max*i/4);
  const cf=new Intl.NumberFormat(S.lang==="he"?"he-IL":"en-US",{notation:"compact",maximumFractionDigits:1});
  return `<div class="legend"><span><i class="key in"></i>${t("cf_income")}</span><span><i class="key out"></i>${t("cf_expense")}</span><span>${t("cf_chartHint")}</span></div>
  <div class="chart">
    <div class="yax" aria-hidden="true">${ticks.map(v=>`<span style="bottom:${v/max*100}%">${cf.format(v)}</span>`).join("")}</div>
    <div class="plot">${ticks.slice(1).map(v=>`<i class="gl" style="bottom:${v/max*100}%"></i>`).join("")}
      <div class="cols">${data.map(d=>`<button type="button" class="grp${d.m===m?" sel":""}" data-act="cfMonth" data-v="${d.m}" data-tin="${d.tin}" data-tout="${d.tout}" aria-label="${esc(mLabel(d.m))}: ${esc(t("cf_income"))} ${esc(money(d.tin))}, ${esc(t("cf_expense"))} ${esc(money(d.tout))}"><i class="in" style="height:${d.tin/max*100}%"></i><i class="out" style="height:${d.tout/max*100}%"></i></button>`).join("")}</div>
    </div>
    <div class="xl" aria-hidden="true">${data.map(d=>`<span class="${d.m===m?"sel":""}">${esc(mLabel(d.m,true))}</span>`).join("")}</div>
    <div class="tip" hidden></div>
  </div>
  <details class="tbl"><summary>${t("cf_table")}</summary><div class="tblwrap"><table class="tb">
    <thead><tr><th>${t("cf_month")}</th><th class="n">${t("cf_income")}</th><th class="n">${t("cf_expense")}</th><th class="n">${t("cf_net")}</th></tr></thead>
    <tbody>${data.slice().reverse().map(d=>`<tr><td>${esc(mLabel(d.m))}</td><td class="n">${money(d.tin)}</td><td class="n">${money(d.tout)}</td><td class="n">${money(d.tin-d.tout)}</td></tr>`).join("")}</tbody>
  </table></div></details>`;
}
function showTip(g){
  const ch=g.closest(".chart"),tip=ch&&ch.querySelector(".tip");if(!tip)return;
  const tin=+g.dataset.tin,tout=+g.dataset.tout;
  tip.dir=S.lang==="he"?"rtl":"ltr";
  tip.innerHTML=`<b>${esc(mLabel(g.dataset.v))}</b><div><span><i class="key in"></i> ${t("cf_income")}</span><span>${money(tin)}</span></div><div><span><i class="key out"></i> ${t("cf_expense")}</span><span>${money(tout)}</span></div><div><span>${t("cf_net")}</span><strong>${money(tin-tout)}</strong></div>`;
  tip.hidden=false;
  const cr=ch.getBoundingClientRect(),gr=g.getBoundingClientRect();
  let x=gr.left-cr.left+gr.width/2-tip.offsetWidth/2;x=Math.max(0,Math.min(x,cr.width-tip.offsetWidth));
  tip.style.left=x+"px";tip.style.top="-8px";tip.style.transform="translateY(-100%)";
}
function hideTip(){document.querySelectorAll(".chart .tip").forEach(t0=>{t0.hidden=true;});}

function cfCats(D){
  const by={};D.out.forEach(x=>{by[x.cat]=(by[x.cat]||0)+x.amt;});
  const rows=Object.entries(by).filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]);
  if(!rows.length)return `<div class="row-meta">${t("cf_noExp")}</div>`;
  const mx=rows[0][1];
  return rows.map(([c,v])=>`<div class="catrow"><span class="lb">${svg(OUT_IC[c]||"list")}<span>${t("oc_"+c)}</span></span><span class="track"><i style="width:${v/mx*100}%"></i></span><span class="num">${money(v)} <span class="muted">${D.tout>0?Math.round(v/D.tout*100):0}%</span></span></div>`).join("");
}
function cfUnits(D){
  const ids=unitIds();
  const sum=(arr,f)=>arr.filter(f).reduce((a,x)=>a+x.amt,0);
  const netCls=n=>n>0.004?"up-good":n<-0.004?"up-bad":"";
  const row=(label,f)=>{const i=sum(D.inc,f),o=sum(D.out,f);return `<tr${i===0&&o===0?" class=\"muted\"":""}><td>${label}</td><td class="n">${money(i)}</td><td class="n">${money(o)}</td><td class="n ${netCls(i-o)}">${money(i-o)}</td></tr>`;};
  return `<div class="tblwrap"><table class="tb"><thead><tr><th>${t("f_unit")}</th><th class="n">${t("cf_income")}</th><th class="n">${t("cf_expense")}</th><th class="n">${t("cf_net")}</th></tr></thead><tbody>
    ${ids.map(u=>row(esc(t("apt",u)),x=>x.u===u)).join("")}
    ${row(t("cf_general"),x=>!x.u||!ids.includes(x.u))}
    <tr class="tot"><td>${t("cf_total")}</td><td class="n">${money(D.tin)}</td><td class="n">${money(D.tout)}</td><td class="n ${netCls(D.net)}">${money(D.net)}</td></tr>
  </tbody></table></div>`;
}
function cfTx(D){
  let list=D.inc.map(x=>Object.assign({dir:"in"},x)).concat(D.out.map(x=>Object.assign({dir:"out"},x)));
  if(S.cfFilter!=="all")list=list.filter(x=>x.dir===S.cfFilter);
  list.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);
  if(!list.length)return `<div class="row-meta">${t("cf_noTx")}</div>`;
  return list.map(x=>{
    const chip=x.src==="rec"?`<span class="chip">${t("chip_rec")}</span>`:x.src==="pay"?`<span class="chip">${t("chip_stay")}</span>`:"";
    const acts=x.src==="entry"?`<button type="button" class="btn ghost small" data-act="editEntry" data-id="${esc(x.id)}"${dis()}>${t("edit")}</button><button type="button" class="btn danger small" data-act="delEntry" data-id="${esc(x.id)}"${dis()}>${t("del")}</button>`
      :x.src==="rec"?`<button type="button" class="btn ghost small" data-act="editRec" data-id="${esc(x.id)}"${dis()}>${t("editRec")}</button>`:"";

  }).join("");
}

  if(!list.length)return `<div class="row-meta">${t("cf_noRec")}</div>`;

    <div class="kpi"><small><i class="key out"></i> ${t("cf_expense")}</small><span class="val">${money(D.tout)}</span>${deltaHtml(D.tout,prevHas?P.tout:null,false)}</div>
    <div class="kpi hero"><small>${t("cf_net")}</small><span class="val">${money(D.net)}</span>${deltaHtml(D.net,prevHas?P.net:null,true)}

function openSheet(sh){S.sheet=sh;drawSheet();setTimeout(()=>{const f=document.querySelector("#sheet [autofocus]")||document.querySelector("#sheet .sheet-body input, #sheet .sheet-body select, #sheet .sheet-body textarea");if(f&&sh.type!=="unit")f.focus();},30);}
function closeSheet(){S.sheet=null;document.getElementById("sheet").innerHTML="";}
function drawSheet(){
  const sh=S.sheet,el=document.getElementById("sheet");if(!sh){el.innerHTML="";return;}
  const keep=el.querySelector(".sheet-body");const sc=keep?keep.scrollTop:0;
  let title="",body="";
  if(sh.type==="unit"){title=t("apt",sh.u);body=sheetUnit(sh.u);}
  else if(sh.type==="issue"){title=t("newIssue");body=formIssue(sh.u);}
  else if(sh.type==="stay"){const st=sh.id?S.stays.find(s=>s.id===sh.id):null;title=st?t("edit")+" · "+(st.guest||t("guest")):t("newStay");body=formStay(st,sh.u,sh.start);}
  else if(sh.type==="pay"){const st=S.stays.find(s=>s.id===sh.id);title=t("addPay")+(st?" · "+(st.guest||t("guest")):"");body=formPay();}
  else if(sh.type==="entry"){const e=sh.id?S.entries.find(x=>x.id===sh.id):null;title=e?t("editEntry"):(sh.k==="in"?t("newIn"):t("newOut"));body=formEntry(e,sh.k);}
  else if(sh.type==="person"){title=t("newUser");body=formPerson();}
  else if(sh.type==="newlogin"){const pp=S.users[sh.id];title=t("newLoginFor",pp?pp.name:"");body=formNewLogin(sh.id);}
  else if(sh.type==="me"){title=t("myAccount");body=sheetMe();}
  else if(sh.type==="rec"){const r=sh.id?S.recurring.find(x=>x.id===sh.id):null;title=r?t("editRec"):t("newRec");body=formRec(r);}
  el.innerHTML=`<div class="scrim" data-act="closeSheet"></div><aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">${sh.type==="unit"?`<div class="tag sm" aria-hidden="true">${esc(sh.u)}</div>`:""}<h2 id="sheet-title">${esc(title)}</h2><button type="button" class="icon-btn" data-act="closeSheet" aria-label="${t("cancel")}">${svg("close")}</button></div>
    <div class="sheet-body">${body}</div></aside>`;
  const nb=el.querySelector(".sheet-body");if(nb&&sc)nb.scrollTop=sc;
}

let toastTimer=null;
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true;},2600);}
async function safe(fn){
  if(!S.db||!S.canWrite){toast(t("errPerm"));return false;}
  try{await fn();return true;}
  catch(e){const c=e&&e.code;
    if(c==="invalid_argument"){S.canWrite=false;toast(t("errPerm"));render();}
    else if(c==="quota_exceeded")toast(t("errQuota"));
    else if(c==="revoked"){S.status="revoked";render();}
    else toast(t("errGen"));
    return false;}
}
function log(type,u,p){if(!S.db)return;S.db.collection("log").add({at:Date.now(),by:actorId(),t:type,u:u||null,p:p||{}}).catch(()=>{});}
async function upsertUnit(u,patch){
  const ref=S.db.doc("units/"+u);
  if(S.units[u]||(await ref.get()).exists)await ref.update(patch);else await ref.set(Object.assign({},patch));
}
async function syncSchedule(u,changedId,changedData){
  const today=todayIso();
  const list=S.stays.filter(s=>s.id!==changedId);if(changedData)list.push(Object.assign({id:changedId},changedData));
  const sch=list.filter(s=>s.u===u&&(!s.end||s.end>=today)).sort((a,b)=>a.start<b.start?-1:1).map(s=>({s:s.start,e:s.end||null,g:String(s.guest||"").trim()}));
  await upsertUnit(u,{schedule:sch});
}

  tab(ds){S.tab=ds.v;LS.set("tab",ds.v);render();window.scrollTo(0,0);},

    if(await safe(()=>S.db.doc("fin/data/recurring/"+r.id).update({to:S.cfMonth||curMonth()}))){log("rec");toast(t("saved"));}},
  async delRec(ds,el){if(!isMgr())return;if(!arm(el))return;const r=S.recurring.find(x=>x.id===ds.id);if(!r)return;
    if(await safe(()=>S.db.doc("fin/data/recurring/"+r.id).delete()))log("rec");},
  async delPay(ds,el){if(!isMgr())return;if(!arm(el))return;const s=S.stays.find(x=>x.id===ds.id);if(!s)return;const idx=+ds.i;
    const pay=(s.pay||[]).filter((_,k)=>k!==idx);
    if(await safe(()=>S.db.doc("fin/data/stays/"+s.id).update({pay})))log("pay_del",s.u);}
};
function arm(el){
  if(el.classList.contains("armed"))return true;
  el.classList.add("armed");const old=el.textContent;el.textContent=t("confirmDel");
  setTimeout(()=>{if(el.isConnected){el.classList.remove("armed");el.textContent=old;}},4000);
  return false;
}

const FORMS={
  async issue(fd,form){
    const cat=fd.get("cat"),desc=String(fd.get("desc")||"").trim();
    if(!cat)return ferr(form,t("e_cat"));if(!desc)return ferr(form,t("e_desc"));
    const doc={u:fd.get("u"),cat,prio:fd.get("prio")||"normal",desc,who:String(fd.get("who")||"").trim(),status:"open",at:Date.now(),by:actorId(),doneAt:null,doneBy:null};
    if(await safe(()=>S.db.collection("issues").add(doc))){log("issue_new",doc.u,{c:cat});const back=S.sheet&&S.sheet.from;closeSheet();if(back)openSheet(back);toast(t("saved"));}
  },
  async stay(fd,form){
    const id=form.dataset.id||null;const old=id?S.stays.find(s=>s.id===id):null;
    const data={u:fd.get("u"),kind:fd.get("kind")||"short",guest:String(fd.get("guest")||"").trim(),contact:String(fd.get("contact")||"").trim(),
      start:fd.get("start")||"",end:fd.get("end")||null,rate:Number(fd.get("rate")),per:fd.get("per")||"night",notes:String(fd.get("notes")||"").trim()};
    if(!data.start)return ferr(form,t("e_start"));
    if(data.end&&data.end<=data.start)return ferr(form,t("e_end"));
    if(fd.get("rate")===""||!isFinite(data.rate)||data.rate<0)return ferr(form,t("e_rate"));
    let ok;
    if(old){
      ok=await safe(()=>S.db.doc("fin/data/stays/"+id).update(data));
      if(ok){log("stay_edit",data.u);const merged=Object.assign({},old,data);delete merged.id;
        await safe(()=>syncSchedule(data.u,id,merged));if(old.u!==data.u)await safe(()=>syncSchedule(old.u,id,merged));}
    }else{
      const fp=Number(fd.get("firstPay"));
      data.pay=fp>0?[{amt:fp,d:todayIso(),m:"",note:"",by:actorId(),at:Date.now()}]:[];
      data.at=Date.now();data.by=actorId();
      const ref=S.db.collection("fin/data/stays").doc();
      ok=await safe(()=>ref.set(data));
      if(ok){log("stay_new",data.u);if(fp>0)log("pay",data.u);await safe(()=>syncSchedule(data.u,ref.id,data));}
    }
    if(ok){closeSheet();toast(t("saved"));}
  },
  async pay(fd,form){
    const s=S.stays.find(x=>x.id===S.sheet.id);if(!s)return closeSheet();
    const amt=Number(fd.get("amt"));if(!(amt>0))return ferr(form,t("e_amt"));
    const pay=(s.pay||[]).concat([{amt,d:fd.get("d")||todayIso(),m:fd.get("m")||"",note:String(fd.get("note")||"").trim(),by:actorId(),at:Date.now()}]);
    if(await safe(()=>S.db.doc("fin/data/stays/"+s.id).update({pay}))){log("pay",s.u);closeSheet();toast(t("saved"));}
  },
  async login(fd,form){
    const u=String(fd.get("username")||""),pin=String(fd.get("pin")||"").trim();
    if(!normUser(u)||!pin)return ferr(form,t("e_login"));
    const btn=form.querySelector("[type=submit]");if(btn)btn.disabled=true;
    try{await FBX.signIn(userEmail(u),pin);}
    catch(e){ferr(form,authMsg(e));const p=form.querySelector("#lg-pin");if(p){p.value="";p.focus();}}
    finally{if(btn&&btn.isConnected)btn.disabled=false;}
  },
  async setup(fd,form){
    if(!S.setupOpen)return;
    const name=String(fd.get("name")||"").trim();if(!name)return ferr(form,t("e_name"));
    const u=fd.get("username");if(!validUser(u))return ferr(form,t("e_user"));
    const pin=checkCode(fd,form);if(!pin)return;
    S.settingUp=true;let acct=null;
    try{
      acct=await FBX.signUp(userEmail(u),pin);
      await S.db.batch().set("meta/setup",{done:true,by:acct.uid,at:Date.now()}).set("users/"+acct.uid,{name,username:normUser(u),role:"manager",at:Date.now()}).commit();
      S.showSetup=false;
    }catch(e){
      if(acct){try{await acct.remove();}catch(_){}}
      S.settingUp=false;render();
      const f=document.querySelector('form[data-form="setup"]');if(f)ferr(f,acct?t("errGen"):authMsg(e));return;
    }
    S.settingUp=false;render();
  },
  async signup(fd,form){
    if(S.setupOpen)return;
    const name=String(fd.get("name")||"").trim().slice(0,40);if(!name)return ferr(form,t("e_name"));
    const u=fd.get("username");if(!validUser(u))return ferr(form,t("e_user"));
    const pin=checkCode(fd,form);if(!pin)return;
    const note=String(fd.get("note")||"").trim().slice(0,200);
    S.settingUp=true;let acct=null;
    try{
      acct=await FBX.signUp(userEmail(u),pin);
      await S.db.doc("users/"+acct.uid).set({name,username:normUser(u),role:"pending",at:Date.now(),note});
      S.showSignup=false;
      notifyManagers({name,username:normUser(u),note});
    }catch(e){
      if(acct){try{await acct.remove();}catch(_){}}
      S.settingUp=false;render();
      const f=document.querySelector('form[data-form="signup"]');if(f)ferr(f,acct?t("errGen"):authMsg(e));return;
    }
    S.settingUp=false;render();
  },
  async person(fd,form){
    const name=String(fd.get("name")||"").trim();if(!name)return ferr(form,t("e_name"));
    const u=fd.get("username");if(!validUser(u))return ferr(form,t("e_user"));
    const r=normRole(fd.get("role"));const pin=checkCode(fd,form);if(!pin)return;
    let uid;try{uid=await FBX.createLogin(userEmail(u),pin);}catch(e){return ferr(form,authMsg(e));}
    if(await safe(()=>S.db.doc("users/"+uid).set({name,username:normUser(u),role:r,at:Date.now(),by:actorId()}))){log("user");closeSheet();toast(t("saved"));}
  },
  async newlogin(fd,form){
    const old=S.sheet&&S.sheet.id,p=S.users[old];if(!p||old===S.uid)return closeSheet();
    const u=fd.get("username");if(!validUser(u))return ferr(form,t("e_user"));
    const pin=checkCode(fd,form);if(!pin)return;
    let uid;try{uid=await FBX.createLogin(userEmail(u),pin);}catch(e){return ferr(form,authMsg(e));}
    const ok=await safe(()=>S.db.batch()
      .set("users/"+uid,{name:p.name,username:normUser(u),role:normRole(p.role),at:Date.now(),by:actorId(),prev:old})
      .update("users/"+old,{disabled:true,replacedBy:uid,disabledAt:Date.now()}).commit());
    if(ok){log("user");closeSheet();toast(t("saved"));}
  },
  async mycode(fd,form){
    const cur=String(fd.get("cur")||"").trim();if(!cur)return ferr(form,t("wrongLogin"));
    const pin=checkCode(fd,form);if(!pin)return;
    try{await FBX.changePassword(cur,pin);closeSheet();toast(t("codeChanged"));}catch(e){ferr(form,authMsg(e));}
  },
  async entry(fd,form){
    const id=form.dataset.id||null,k=form.dataset.k==="in"?"in":"out";
    const amt=Number(fd.get("amt"));if(!(amt>0))return ferr(form,t("e_amt"));
    const d=fd.get("d")||todayIso();
    const data={kind:k,amt,d,cat:fd.get("cat")||(k==="in"?"other_in":"other"),u:fd.get("u")||"",note:String(fd.get("note")||"").trim()};
    let ok;
    if(id)ok=await safe(()=>S.db.doc("fin/data/entries/"+id).update(data));
    else{data.at=Date.now();data.by=actorId();ok=await safe(()=>S.db.collection("fin/data/entries").add(data));}
    if(ok){log(id?"entry_edit":"entry_new",data.u,{k});S.cfMonth=d.slice(0,7);closeSheet();toast(t("saved"));render();}
  },
  async rec(fd,form){
    const id=form.dataset.id||null;
    const amt=Number(fd.get("amt"));if(!(amt>0))return ferr(form,t("e_amt"));
    const from=String(fd.get("from")||"").trim(),to=String(fd.get("to")||"").trim();
    if(!validMonth(from))return ferr(form,t("e_month"));
    if(to&&(!validMonth(to)||to<from))return ferr(form,t("e_toFrom"));
    const data={kind:"out",amt,cat:fd.get("cat")||"rent",u:fd.get("u")||"",day:Math.min(28,Math.max(1,parseInt(fd.get("day"),10)||1)),from,to:to||null,note:String(fd.get("note")||"").trim()};
    let ok;
    if(id)ok=await safe(()=>S.db.doc("fin/data/recurring/"+id).update(data));
    else{data.at=Date.now();data.by=actorId();ok=await safe(()=>S.db.collection("fin/data/recurring").add(data));}
    if(ok){log("rec");closeSheet();toast(t("saved"));}
  },
  async sysname(fd,form){
    const name=String(fd.get("name")||"").trim().slice(0,40);
    if(await safe(()=>S.db.doc("settings/main").set(Object.assign({},S.settings,{name:name||null})))){log("cur");toast(t("saved"));}
  },
  async unit(fd,form){
    const u=form.dataset.u;
    const patch={notes:String(fd.get("notes")||"").trim(),mode:fd.get("mode")||null,blocked:fd.get("blocked")==="on",blockNote:String(fd.get("blockNote")||"").trim()};
    if(await safe(()=>upsertUnit(u,patch))){log("unit",u);toast(t("saved"));}
  }
};
function ferr(form,msg){const e=form.querySelector("#form-err");if(e)e.textContent=msg;}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.disabled)return;
  const fn=ACT[el.dataset.act];if(!fn)return;
  if(el.dataset.act==="newIssue"&&S.sheet&&S.sheet.type==="unit"){openSheet({type:"issue",u:el.dataset.u||"",from:S.sheet});return;}
  fn(el.dataset,el,e);
});
document.addEventListener("submit",e=>{
  const form=e.target.closest("form[data-form]");if(!form)return;e.preventDefault();
  const k=form.dataset.form;
  if(["stay","pay","entry","rec","unit","person","newlogin","sysname"].includes(k)&&!isMgr())return;
  if(k==="issue"&&!perm("report"))return;
  const fn=FORMS[k];if(fn)fn(new FormData(form),form);
});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.name==="kind"){const form=el.closest('form[data-form="stay"]');if(form&&!form.dataset.id){const per=form.querySelector("#fs-per");if(per)per.value=el.value==="long"?"month":"night";}}
  const k=el.dataset&&el.dataset.chg;if(!k)return;
  if(k==="issueUnit"){S.issueUnit=el.value;render();}
  else if(k==="prole"){const id=el.dataset.id,p=S.users[id],v=normRole(el.value);if(!p||!isMgr())return;
    if(p.role==="manager"&&v!=="manager"&&mgrCount()<=1){toast(t("e_lastMgr"));el.value="manager";return;}
    if(await safe(()=>S.db.doc("users/"+id).update({role:v})))log("user");}
  else if(k==="importFile"){const f=el.files&&el.files[0];if(!f||!isMgr())return;
    try{
      const data=JSON.parse(await f.text());const ALLOW=["units","issues","fin/data/stays","fin/data/entries","fin/data/recurring","settings"];const ops=[];
      for(const c of ALLOW){const docs=data[c];if(docs&&typeof docs==="object")for(const id in docs){
        if(/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id)&&docs[id]&&typeof docs[id]==="object"&&!Array.isArray(docs[id]))ops.push([c+"/"+id,docs[id]]);}}
      if(!ops.length)throw new Error("empty");
      S.pendingImport={ops,count:ops.length};render();
    }catch(_){toast(t("e_importFile"));}
    el.value="";}
  else if(k==="currency"){const v=el.value;if(await safe(()=>S.db.doc("settings/main").set(Object.assign({},S.settings,{currency:v||null}))))log("cur");}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){hideTip();if(S.sheet)closeSheet();}});
["mouseover","focusin"].forEach(ev=>document.addEventListener(ev,e=>{const g=e.target.closest&&e.target.closest(".grp");if(g)showTip(g);}));
["mouseout","focusout"].forEach(ev=>document.addEventListener(ev,e=>{const g=e.target.closest&&e.target.closest(".grp");if(g&&!(e.relatedTarget&&g.contains(e.relatedTarget)))hideTip();}));

function applyLang(){const r=document.documentElement;r.lang=S.lang;r.dir=S.lang==="he"?"rtl":"ltr";}

/* ---------- people ---------- */
function resolvePeople(){}

/* ---------- boot ---------- */
let FBX=null,profUnsub=null,dataSubs=[],dataRole=null;
function stopData(){
  dataSubs.forEach(u=>{try{u();}catch(_){}});dataSubs=[];dataRole=null;
  S.units={};S.issues=[];S.stays=[];S.entries=[];S.recurring=[];S.log=[];S.users={};S.settings={};S.pendingImport=null;
}
function startData(r){
  stopData();if(!r)return;dataRole=r;const db=S.db;
  const onErr=e=>{if(e&&e.code==="revoked"&&FBX)FBX.signOut();};
  const list=(c,k)=>db.collection(c).onSnapshot(s=>{S[k]=s.docs.map(d=>Object.assign({id:d.id},d.data()));render();},onErr);
  const map=(c,k)=>db.collection(c).onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data();});S[k]=o;render();},onErr);
  dataSubs.push(map("units","units"),list("issues","issues"),map("users","users"),
    db.doc("settings/main").onSnapshot(d=>{S.settings=d.exists?d.data():{};render();},onErr));
  if(r==="manager")dataSubs.push(list("fin/data/stays","stays"),list("fin/data/entries","entries"),list("fin/data/recurring","recurring"),
    db.collection("log").orderBy("at","desc").limit(80).onSnapshot(s=>{S.log=s.docs.map(d=>Object.assign({id:d.id},d.data()));render();},onErr));
}
async function init(){
  applyLang();
  if(location.hash==="#requests")S.tab="more";
  render();
  if(!firebaseConfig||!firebaseConfig.apiKey||!firebaseConfig.projectId){S.status="noconfig";render();return;}
  try{FBX=await connect(firebaseConfig);}catch(e){S.status="noconfig";render();return;}
  S.db=FBX.db;S.status="ok";
  S.db.doc("meta/setup").onSnapshot(d=>{S.setupOpen=!d.exists;if(!S.setupOpen)S.showSetup=false;render();},()=>{S.setupOpen=false;render();});
  FBX.onAuth(u=>{
    if(profUnsub){profUnsub();profUnsub=null;}
    stopData();
    S.authUser=u;S.uid=u?u.uid:null;S.authReady=true;S.profile=null;S.profileLoaded=false;
    if(u){
      profUnsub=S.db.doc("users/"+u.uid).onSnapshot(d=>{
        S.profile=d.exists?d.data():null;S.profileLoaded=true;
        const r=S.profile&&!S.profile.disabled&&ROLES.includes(S.profile.role)?S.profile.role:null;
        if(r!==dataRole)startData(r);
        render();
      },()=>{S.profile=null;S.profileLoaded=true;startData(null);render();});
    }else closeSheet();
    render();
  });
}
init();
})();
